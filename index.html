<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>NuBrakes Operations Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--text:#111827;--muted:#6b7280;--soft:#9ca3af;--border:#e5e7eb;--border-soft:#f1f5f9;--green:#10b981;--red:#f43f5e;--indigo:#6366f1;--dark:#111827;--shadow:0 1px 4px rgba(0,0,0,.06);--radius:12px;
--heat-g1:#f0fdf7;--heat-g2:#dcfce9;--heat-g3:#bbf3d6;--heat-g4:#93e8bf;--heat-r1:#fff5f7;--heat-r2:#ffe6ea;--heat-r3:#fecdd6;--heat-r4:#fbb3c1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-feature-settings:"tnum" 0}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.app{min-height:100vh;padding:20px 16px}
.app-inner{max-width:1320px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.title{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.subtitle{margin:3px 0 0;font-size:12px;color:var(--muted)}
h2{font-size:14px;margin:0 0 3px}
.status-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.badge,.coverage,.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;border:1px solid;font-size:11px;font-weight:600;background:#fff}
.badge.live{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
.badge-dot{width:6px;height:6px;border-radius:999px;background:#10b981}
.coverage,.chip{border-color:var(--border);color:var(--muted)}
.toolbar{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:3px;font-size:9px;text-transform:uppercase;font-weight:700;color:var(--soft);letter-spacing:.05em}
.select,input{padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;color:#374151;background:#fff;min-width:150px;height:35px}
select{cursor:pointer}
.tabs{display:flex;margin-bottom:22px;border-bottom:1.5px solid var(--border);overflow-x:auto}
.tabs button{padding:8px 20px;border:0;background:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button.active{color:var(--text);border-bottom-color:var(--text)}
.tabs button:hover{color:var(--text)}
.kpi-group{margin-bottom:20px}
.group-name{font-size:10px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card,.section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-soft)}
.card{padding:16px 18px 14px;min-height:152px}
.metric{font-size:10px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.value{font-size:22px;font-weight:700;margin-bottom:8px;font-variant-numeric:tabular-nums}
.compare{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:10px;color:var(--soft)}
.delta{font-size:11px;font-weight:600}
.delta.goal-pos{color:#047857}.delta.goal-neg{color:#be123c}
.spark-wrap{display:flex;align-items:center;gap:7px;height:34px;margin:4px 0 2px;position:relative}
.sparkline{display:block;width:100%;height:32px;cursor:crosshair}
.spark-tip{position:absolute;bottom:calc(100% + 4px);transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:6px;padding:4px 8px;font-size:11px;line-height:1.35;white-space:nowrap;pointer-events:none;z-index:5;box-shadow:0 4px 12px rgba(15,23,42,.18)}
.spark-tip b{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.spark-tip span{color:#cbd5e1;font-size:10px}
.spark-caption{flex:0 0 auto;font-size:9px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;writing-mode:vertical-rl;transform:rotate(180deg)}
.section{padding:16px 18px;margin-bottom:16px}
.section>.small{margin-top:2px;margin-bottom:14px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head .small{margin:2px 0 0}
.scroll{overflow:auto;border:1px solid var(--border-soft);border-radius:8px;max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}
th{position:sticky;top:0;background:#f8fafc;color:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.04em;z-index:2;box-shadow:inset 0 -1px 0 var(--border)}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--text)}
td,th{border-bottom:1px solid var(--border-soft);padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child,td.txt,th.txt{text-align:left}
tbody tr:hover td:not(.heat){background:#fafbff}
.pin{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--border)}
th.pin{background:#f8fafc;z-index:3;box-shadow:1px 0 0 var(--border),inset 0 -1px 0 var(--border)}
tbody tr:hover .pin{background:#fafbff}
tfoot td{position:sticky;bottom:0;background:#fbfbfd;font-weight:700;border-top:1.5px solid var(--border);border-bottom:0;z-index:1}
tfoot td.pin{z-index:2;background:#fbfbfd}
.heat{border-radius:0}
.link{color:#4338ca;font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;gap:4px;background:#f1f5f9;border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{padding:5px 12px;border-radius:6px;border:0;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--soft)}
.seg button:hover{color:var(--text)}
.seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.toggle:hover{border-color:#cbd5e1;color:var(--text)}
.toggle[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
.toggle .dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1}
.toggle[aria-pressed="true"] .dot{background:#6ee7b7}
.picker{position:relative}
.picker>summary{list-style:none;cursor:pointer;padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:12px;font-weight:600}
.picker>summary::-webkit-details-marker{display:none}
.picker[open]>summary{border-color:var(--dark);color:var(--text)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:6;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:0 12px 28px rgba(15,23,42,.16);width:262px;max-height:340px;overflow:auto}
.menu label{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 2px;cursor:pointer;color:#374151;text-transform:none;font-weight:500;letter-spacing:0}
.menu input{min-width:0;height:auto;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow:auto;padding:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.pill:hover{border-color:#cbd5e1;color:var(--text)}
.pill[aria-pressed="true"]{border-color:#cbd5e1;color:var(--text);background:#fbfbfd}
.pill .dot{width:8px;height:8px;border-radius:999px;background:#e5e7eb;flex:0 0 auto}
.legend{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.legend i{display:block;width:20px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.05)}
.rangebar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.notice{max-width:1320px;margin:auto;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--border);color:var(--muted)}
.notice.small{margin-bottom:16px;padding:10px 14px}
.chart-wrap{height:380px}
.detail{position:fixed;right:0;top:0;width:min(540px,100vw);height:100vh;background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 22px rgba(0,0,0,.1);padding:22px;overflow:auto;z-index:9}
.detail .close{float:right;background:#f1f5f9;border:0;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.hidden{display:none!important}
.warn{color:#c2410c}
.small{font-size:11px;color:var(--muted);line-height:1.5}
.goal-table input{width:120px;min-width:0}
.definition td{vertical-align:top;white-space:normal}
.definition td:nth-child(2),.definition td:nth-child(3),.definition td:nth-child(4),.definition td:nth-child(5){text-align:left}
.definition th{text-align:left}
.fallback td,.fallback th{text-align:left}
.btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#374151}
.btn:hover{border-color:#cbd5e1}
@media(max-width:1023px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:639px){.app{padding:12px}.top{display:block}.status-row{justify-content:flex-start;margin-top:8px}.field{flex:1 1 140px}.select,.field input{min-width:100%;width:100%}.tabs button{padding-inline:12px}.cards{grid-template-columns:1fr}.card{min-height:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main class="app" id="app"><div class="notice">Loading NuBrakes operations and labor feeds…</div></main>

<script>

/* dir: +1 higher is better, -1 lower is better, 0 volume-driven (never heat-shaded). */
const METRICS={
 revenue:{key:'revenue',label:'Revenue',format:'currency',dir:1,formula:'Σ revenue_amount',fields:'revenue_amount',description:'Invoiced revenue; booked revenue is not used.'},
 revenuePace:{key:'revenuePace',label:'Revenue Pace',format:'currency',dir:1,formula:'MTD revenue ÷ business days elapsed × business days in month',fields:'revenue_amount, worked_day_flag',description:'Business days are days with any worked technician in the active filter.'},
 goal:{key:'goal',label:'Monthly Revenue Goal',format:'currency',dir:0,formula:'Manager-supplied goal',fields:'in-memory goal state',description:'Editable and exportable; not stored in browser storage.'},
 variance:{key:'variance',label:'Variance to Goal',format:'currency',dir:1,formula:'Revenue Pace − Monthly Revenue Goal',fields:'revenue_amount, worked_day_flag, goals',description:'Also reports percentage of goal.'},
 jobs:{key:'jobs',label:'Jobs Completed',format:'number',dir:1,formula:'Σ completed_jobs_count',fields:'completed_jobs_count',description:''},
 jobsPace:{key:'jobsPace',label:'Jobs Pace',format:'number',dir:1,formula:'MTD jobs ÷ elapsed business days × business days in month',fields:'completed_jobs_count, worked_day_flag',description:''},
 avgTicket:{key:'avgTicket',label:'Average Ticket',format:'currency',dir:1,formula:'Σ revenue_amount ÷ Σ invoiced_jobs_count',fields:'revenue_amount, invoiced_jobs_count',description:'Ratio of summed components, not an average of averages.'},
 ticketCompletion:{key:'ticketCompletion',label:'Ticket Completion Rate',format:'percent',dir:1,formula:'Σ revenue_amount ÷ Σ booked_revenue_amount',fields:'revenue_amount, booked_revenue_amount',description:'Completed revenue against the revenue booked on the ticket. Above 100% means work completed on site came in above what was booked.'},
 rotorAttach:{key:'rotorAttach',label:'Rotor Attachment Rate',format:'percent',dir:1,formula:'Σ rotor_attached_jobs_count ÷ Σ rotor_eligible_jobs_count',fields:'rotor_attached_jobs_count, rotor_eligible_jobs_count',description:'Eligible jobs only; jobs with no rotor opportunity are excluded from the denominator.'},

 activeTechs:{key:'activeTechs',label:'Active Technicians',format:'number',dir:0,formula:'distinct technician_id with a worked day',fields:'technician_id, worked_day_flag',description:''},
 daysWorked:{key:'daysWorked',label:'Days Worked',format:'number',dir:0,formula:'Σ worked_day_flag',fields:'worked_day_flag',description:'Zero-activity days are excluded from per-day averages.'},
 jobsPerTech:{key:'jobsPerTech',label:'Jobs per Technician',format:'number',dir:1,formula:'Σ completed jobs ÷ active technicians',fields:'completed_jobs_count, technician_id, worked_day_flag',description:''},
 revPerTech:{key:'revPerTech',label:'Revenue per Technician',format:'currency',dir:1,formula:'Σ revenue ÷ active technicians',fields:'revenue_amount, technician_id, worked_day_flag',description:''},
 revenuePerDay:{key:'revenuePerDay',label:'Revenue / Day',format:'currency',dir:1,formula:'Σ revenue ÷ Σ worked_day_flag',fields:'revenue_amount, worked_day_flag',description:'Uses days worked, not calendar days.'},
 jobsPerDay:{key:'jobsPerDay',label:'Jobs / Day',format:'number',dir:1,formula:'Σ completed jobs ÷ Σ worked_day_flag',fields:'completed_jobs_count, worked_day_flag',description:'Uses days worked, not calendar days.'},
 invoicedHours:{key:'invoicedHours',label:'Invoiced Hours',format:'hours',dir:1,formula:'Σ invoiced_minutes ÷ 60',fields:'invoiced_minutes',description:''},
 payrollInvoicedHours:{key:'payrollInvoicedHours',label:'Invoiced Hours (Payroll Days)',format:'hours',dir:0,formula:'Σ invoiced_minutes ÷ 60 on days with allocated payroll',fields:'invoiced_minutes, Regular, Overtime, worked_day_flag',description:'Invoiced hours limited to days that have clocked hours, so it lines up with Clocked Hours while payroll lags operations. Volume-driven, so it is not heat-shaded.',requiresLabor:true},
 utilization:{key:'utilization',label:'Technician Efficiency',format:'percent',dir:1,formula:'Invoiced Hours (Payroll Days) ÷ Clocked Hours',fields:'invoiced_minutes, Regular, Overtime',description:'Only days covered by payroll count on both sides, so days after the latest payroll week do not inflate efficiency. Labor coverage required.',requiresLabor:true},
 clockedHours:{key:'clockedHours',label:'Clocked Hours (Regular + OT)',format:'hours',dir:0,formula:'Σ allocated (Regular + Overtime) hours',fields:'Regular, Overtime, worked_day_flag',description:'Hours actually worked; Holiday and Paid Time Off are excluded. Weekly labor is split evenly over worked days. Volume-driven, so it is not heat-shaded.',requiresLabor:true},
 regularHours:{key:'regularHours',label:'Regular',format:'hours',dir:0,formula:'Σ allocated Regular hours',fields:'Regular, worked_day_flag',description:'Volume-driven, so it is not heat-shaded.',requiresLabor:true},
 overtimeHours:{key:'overtimeHours',label:'Overtime',format:'hours',dir:0,formula:'Σ allocated Overtime hours',fields:'Overtime, worked_day_flag',description:'Volume-driven, so it is not heat-shaded.',requiresLabor:true},
 holidayHours:{key:'holidayHours',label:'Holiday',format:'hours',dir:0,formula:'Σ allocated Holiday hours',fields:'Holiday, worked_day_flag',description:'Paid, not worked; excluded from Clocked Hours.',requiresLabor:true},
 ptoHours:{key:'ptoHours',label:'Paid Time Off',format:'hours',dir:0,formula:'Σ allocated Paid Time Off hours',fields:'Paid Time Off, worked_day_flag',description:'Paid, not worked; excluded from Clocked Hours.',requiresLabor:true},
 driveHours:{key:'driveHours',label:'Drive Time Hours',format:'hours',dir:0,formula:'Σ daily Normalized Drive Time × 90%, on days with clocked hours',fields:'Normalized Drive Time (fact_technician_operations_daily), Regular, Overtime',description:'Daily drive hours from the operations feed. Limited to the same payroll-covered days as Invoiced Hours (Payroll Days) so Total Technician Efficiency compares like with like.',requiresLabor:true},
 totalEfficiency:{key:'totalEfficiency',label:'Total Technician Efficiency',format:'percent',dir:1,formula:'(Drive Time Hours + Invoiced Hours (Payroll Days)) ÷ Clocked Hours (Regular + OT)',fields:'Normalized Drive Time (operations daily), invoiced_minutes, Regular, Overtime',description:'Technician Efficiency with drive time credited as productive time. Labor coverage required.',requiresLabor:true},
 laborCost:{key:'laborCost',label:'Labor Cost',format:'currency',dir:0,formula:'Σ allocated Total Employer Cost',fields:'Total Employer Cost, worked_day_flag',description:'Volume-driven, so it is not heat-shaded; use Labor Cost % of Revenue for the rate-adjusted view.',requiresLabor:true},
 laborPct:{key:'laborPct',label:'Labor Cost % of Revenue',format:'percent',dir:-1,formula:'Labor Cost ÷ Revenue',fields:'Total Employer Cost, revenue_amount',description:'Labor coverage required. Lower is better.',requiresLabor:true},
 parts:{key:'parts',label:'Parts Cost',format:'currency',dir:0,formula:'Σ parts_cost_amount',fields:'parts_cost_amount',description:'Volume-driven, so it is not heat-shaded.'},
 grossProfit:{key:'grossProfit',label:'Simple Gross Profit',format:'currency',dir:1,formula:'Revenue − Labor Cost − Parts Cost',fields:'revenue_amount, Total Employer Cost, parts_cost_amount',description:'Labor coverage required.',requiresLabor:true},
 grossMargin:{key:'grossMargin',label:'Simple Gross Margin',format:'percent',dir:1,formula:'Simple Gross Profit ÷ Revenue',fields:'revenue_amount, Total Employer Cost, parts_cost_amount',description:'Labor coverage required.',requiresLabor:true},
 grossPerJob:{key:'grossPerJob',label:'Simple Gross Profit / Job',format:'currency',dir:1,formula:'Simple Gross Profit ÷ Σ completed_jobs_count',fields:'revenue_amount, Total Employer Cost, parts_cost_amount, completed_jobs_count',description:'Labor coverage required.',requiresLabor:true},
 grossPerTech:{key:'grossPerTech',label:'Simple Gross Profit per Technician',format:'currency',dir:1,formula:'Simple Gross Profit ÷ Active Technicians',fields:'revenue_amount, Total Employer Cost, parts_cost_amount, technician_id',description:'Labor coverage required.',requiresLabor:true}
};
const TECH_COLS=['market','daysWorked','revenue','revenuePerDay','jobs','jobsPerDay','avgTicket','ticketCompletion','rotorAttach','serviceRate','clockedHours','invoicedHours','payrollInvoicedHours','utilization','laborCost','laborPct','parts','grossProfit','grossMargin','grossPerJob'];
const PRESETS={
 all:{label:'All metrics',cols:TECH_COLS.slice()},
 kpi:{label:'Performance / KPI',cols:['market','revenue','jobs','jobsPerDay','avgTicket','ticketCompletion','rotorAttach','serviceRate']},
 efficiency:{label:'Efficiency',cols:['market','clockedHours','invoicedHours','payrollInvoicedHours','utilization','laborCost','laborPct']},
 profit:{label:'Profitability',cols:['market','revenue','laborCost','parts','grossProfit','grossMargin','grossPerJob']}
};
const CMP_COLS=['revenue','jobs','jobsPerDay','avgTicket','ticketCompletion','rotorAttach','serviceRate','clockedHours','invoicedHours','payrollInvoicedHours','utilization','laborCost','laborPct','parts','grossProfit','grossMargin','grossPerJob'];
const TEXAS_MARKETS=['Dallas','Austin','Houston','San Antonio'];
const REGIONS=[['all','All'],['Texas','Texas'],['East','East']];
const SERIES=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const RANGES=[['period','Selected period'],['l30','Last 30 days'],['l90','Last 90 days'],['l180','Last 6 months'],['ytd','Year to date'],['all','All data'],['custom','Custom']];
const GRAINS=[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']];
const state={ops:[],labor:[],allocated:[],allocIndex:new Map,region:'all',market:'All Markets',employment:'all',period:'month',periodKey:'',techs:[],tab:'market',sort:{key:'revenue',dir:-1},goals:{},
 trendMetric:'revenue',granularity:'daily',range:{mode:'period',start:'',end:''},trendLabels:true,
 heat:{tech:true,market:true,compare:true},techPreset:'all',techCols:PRESETS.all.cols.slice(),colMenu:false,
 cmpMode:'tech',cmpTechs:[],cmpMarkets:[],cmpMetric:'avgTicket',cmpLabels:false,cmpDelta:false,cmpColors:{},cmpSeeded:false,
 cache:new Map(),detail:null};
let trendChart,cmpChart;
const n=x=>Number(x)||0,day=r=>String(r.day).slice(0,10),week=r=>String(r.week).slice(0,10);
const fmtDate=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDateY=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v,f){if(v==null||Number.isNaN(v))return '—';if(f==='currency')return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:Math.abs(v)>=1000?0:1}).format(v);if(f==='percent')return (v*100).toFixed(1)+'%';if(f==='hours')return v.toFixed(1)+'h';return new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(v)}
function numShort(v,f){if(v==null||!Number.isFinite(v))return '';if(f==='currency'){let a=Math.abs(v);return a>=10000?(v<0?'-$':'$')+(Math.abs(v)/1000).toFixed(1)+'k':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v)}if(f==='percent')return (v*100).toFixed(0)+'%';if(f==='hours')return v.toFixed(0)+'h';return new Intl.NumberFormat('en-US',{maximumFractionDigits:Math.abs(v)<10?1:0}).format(v)}
function shiftDays(iso,d){let x=new Date(iso+'T12:00:00');x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
function spanDays(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1}

/* ---------- period + range ---------- */

 let missing=state.ops.filter(r=>String(r.normalized_actual_duration_minutes).trim()==='').length,parts=state.ops.reduce((a,r)=>a+n(r.parts_lines_missing_cost),0),bad=[],by=new Map;

 by.forEach(rs=>{let s=summarize(rs,{alloc:true});if(s.utilization!=null&&(s.utilization>1||s.utilization<.2))bad.push(rs[0].technician_name+': '+num(s.utilization,'percent'))});
 let driveStart=state.ops.filter(r=>n(r['Normalized Drive Time'])>0).map(day).sort()[0],noDrive=new Map;
 if(driveStart)state.ops.forEach(r=>{if(day(r)<driveStart||!n(r.worked_day_flag))return;let e=noDrive.get(r.technician_id)||{id:r.technician_id,name:r.technician_name,market:r.market_name,type:r.pt_ft_tagging||'',days:0,missing:0,ever:false};
  e.days++;if(n(r['Normalized Drive Time'])>0)e.ever=true;else e.missing++;noDrive.set(r.technician_id,e)});
 let noDriveList=[...noDrive.values()].filter(e=>e.missing).sort((a,b)=>(b.missing/b.days)-(a.missing/a.days)||b.missing-a.missing);
 let noDriveTable=noDriveList.length?'<div class="scroll" style="margin:6px 0 4px"><table><thead><tr><th class="pin txt">Technician</th><th class="txt">Market</th><th class="txt">PT/FT</th><th>Worked days without drive time</th><th>Share of worked days</th><th class="txt">Drive time on other days</th></tr></thead><tbody>'+

 '<p class="small">Labor is evenly allocated across worked days. If none exist in a labor week, it remains attributed to the technician\'s most frequent market rather than being dropped.</p></section>'}

const valueLabels={id:'valueLabels',afterDatasetsDraw(chart,args,opts){

  let step=1;if(els.length>1){let gap=Math.abs(els[els.length-1].x-els[0].x)/(els.length-1);step=Math.max(1,Math.ceil(44/Math.max(gap,1)))}
  els.forEach((el,i)=>{let v=ds.data[i];if(v==null||!Number.isFinite(v))return;if(i%step&&i!==els.length-1)return;
   let text=numShort(v,opts.format);if(!text)return;let x=el.x,y=el.y-7;if(y<14)y=el.y+18;
   ctx.lineWidth=3;ctx.strokeStyle='#ffffff';ctx.strokeText(text,x,y);ctx.fillStyle=ds.borderColor||'#374151';ctx.fillText(text,x,y)})});
 ctx.restore()}};

function sparkSeries(key){let endKey=activePeriodKey(),keys=periodKeys().filter(k=>k<=endKey).slice(-8),
 base=state.ops.filter(r=>mktOK(r.market_name)&&empOK(r)&&(!state.techs.length||state.techs.includes(r.technician_id))),

 return{keys,values:keys.map(k=>{let rs=base.filter(r=>bucket(r)===k),last=rs.map(day).sort().at(-1),opts=state.period==='month'&&last?{pace:last,noCache:true}:{noCache:true};return summarize(rs,opts)[key]})}}
function sparkPeriod(k){if(state.period==='month')return new Date(k+'-01T12:00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'});if(state.period==='week')return 'Week of '+fmtDateY(k);return new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function paintSpark(canvas,s,hover){let key=canvas.dataset.spark,keys=s.keys,values=s.values,
  finite=values.filter(Number.isFinite),ratio=window.devicePixelRatio||1,w=Math.max(100,canvas.clientWidth),h=32;
  canvas.width=w*ratio;canvas.height=h*ratio;let ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#eef2f7';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,h-4);ctx.lineTo(w,h-4);ctx.stroke();
  if(!finite.length){ctx.fillStyle='#9ca3af';ctx.font='10px system-ui';ctx.fillText('No trend data',2,19);return null}
  let min=Math.min(...finite),max=Math.max(...finite),spread=max-min||Math.abs(max)||1,
  x=i=>keys.length===1?w/2:i*(w-4)/(keys.length-1)+2,y=v=>h-5-(v-min)/spread*(h-10),
  color=key==='variance'?(finite.at(-1)>=0?'#047857':'#be123c'):'#4a3aa7';
  if(hover!=null){ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x(hover),1);ctx.lineTo(x(hover),h-4);ctx.stroke()}
  ctx.strokeStyle=color;ctx.lineWidth=1.75;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();let drawing=false;
  values.forEach((v,i)=>{if(!Number.isFinite(v)){drawing=false;return}if(!drawing){ctx.moveTo(x(i),y(v));drawing=true}else ctx.lineTo(x(i),y(v))});ctx.stroke();
  let dot=(i,r)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(x(i),y(values[i]),r,0,Math.PI*2);ctx.fill()};
  let lastIndex=values.findLastIndex(Number.isFinite);
  if(lastIndex>=0&&hover!==lastIndex)dot(lastIndex,2.6);
  if(hover!=null&&Number.isFinite(values[hover])){dot(hover,3.6);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
  return{x,w}}
function drawSparklines(){if(state.tab!=='market')return;
 document.querySelectorAll('.sparkline').forEach(canvas=>{let key=canvas.dataset.spark,m=METRICS[key],s=sparkSeries(key),geo=paintSpark(canvas,s,null),wrap=canvas.parentElement;
  canvas.removeAttribute('title');
  if(!geo||!s.keys.length)return;
  let tip=document.createElement('div');tip.className='spark-tip hidden';tip.setAttribute('role','tooltip');wrap.appendChild(tip);
  let show=i=>{let g=paintSpark(canvas,s,i),last=i===s.keys.length-1&&bounds().max<(state.period==='month'?s.keys[i]+'-31':state.period==='week'?shiftDays(s.keys[i],6):s.keys[i]);
    tip.innerHTML='<b>'+num(s.values[i],m.format)+'</b><span>'+esc(sparkPeriod(s.keys[i]))+(last?' · to date':'')+'</span>';
    tip.classList.remove('hidden');let left=canvas.offsetLeft+g.x(i),half=tip.offsetWidth/2,maxL=wrap.clientWidth-half;
    tip.style.left=Math.max(half,Math.min(maxL,left))+'px'};
  let hide=()=>{tip.classList.add('hidden');paintSpark(canvas,s,null)};
  let pick=clientX=>{let r=canvas.getBoundingClientRect(),px=clientX-r.left,best=0,bd=Infinity;
    s.keys.forEach((_,i)=>{let d=Math.abs(geo.x(i)-px);if(d<bd){bd=d;best=i}});return best};
  canvas.onmousemove=e=>show(pick(e.clientX));canvas.onmouseleave=hide;
  canvas.ontouchstart=e=>{show(pick(e.touches[0].clientX))};canvas.ontouchend=()=>setTimeout(hide,1500);
  canvas.tabIndex=0;let cur=s.keys.length-1;
  canvas.onfocus=()=>show(cur);canvas.onblur=hide;
  canvas.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){cur=Math.max(0,Math.min(s.keys.length-1,cur+(e.key==='ArrowLeft'?-1:1)));show(cur);e.preventDefault()}};
  canvas.setAttribute('aria-label',m.label+' trend: '+s.keys.map((k,i)=>sparkPeriod(k)+' '+num(s.values[i],m.format)).join(', '))})}

function on(sel,ev,fn){let el=document.querySelector(sel);if(el)el[ev]=fn}
function wire(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 on('#period','onchange',e=>{state.period=e.target.value;state.periodKey='';render()});
 on('#periodKey','onchange',e=>{state.periodKey=e.target.value;render()});
 on('#market','onchange',e=>{state.market=e.target.value;render()});
 on('#region','onchange',e=>{state.region=e.target.value;
  if(state.market!=='All Markets'&&!regionOK(state.market))state.market='All Markets';
  let ok=new Set(state.ops.filter(r=>regionOK(r.market_name)).map(r=>r.technician_id));
  state.techs=state.techs.filter(id=>ok.has(id));
  state.cmpSeeded=false;state.cmpColors={};state.detail=null;render()});
 on('#employment','onchange',e=>{state.employment=e.target.value;
  let ok=new Set(state.ops.filter(empOK).map(r=>r.technician_id));
  state.techs=state.techs.filter(id=>ok.has(id));
  state.cmpTechs=state.cmpTechs.filter(id=>{if(ok.has(id))return true;delete state.cmpColors[id];return false});
  render()});
 on('#techs','onchange',e=>{state.techs=[...e.target.selectedOptions].map(o=>o.value);render()});
 on('#clearTechs','onclick',()=>{state.techs=[];render()});
 document.querySelectorAll('[data-market]').forEach(x=>x.onclick=()=>{state.market=x.dataset.market;state.tab='tech';render()});
 document.querySelectorAll('[data-tech]').forEach(x=>x.onclick=()=>{state.detail=x.dataset.tech;render()});
 document.querySelectorAll('[data-sort]').forEach(x=>x.onclick=()=>{let k=x.dataset.sort;state.sort={key:k,dir:state.sort.key===k?-state.sort.dir:-1};render()});
 document.querySelectorAll('[data-gran]').forEach(x=>x.onclick=()=>{state.granularity=x.dataset.gran;render()});
 document.querySelectorAll('[data-range]').forEach(x=>x.onclick=()=>{let m=x.dataset.range;if(m==='custom'&&!state.range.start){let r=rangeDates();state.range.start=r.start;state.range.end=r.end}state.range.mode=m;render()});
 on('#rangeStart','onchange',e=>{state.range.start=e.target.value;render()});
 on('#rangeEnd','onchange',e=>{state.range.end=e.target.value;render()});
 document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{let k=x.dataset.toggle;
  if(k==='cmpDelta')state.cmpDelta=!state.cmpDelta;else if(k==='cmpLabels')state.cmpLabels=!state.cmpLabels;else if(k==='trendLabels')state.trendLabels=!state.trendLabels;else state.heat[k]=!state.heat[k];render()});
 document.querySelectorAll('[data-preset]').forEach(x=>x.onclick=()=>{let k=x.dataset.preset;state.techPreset=k;state.techCols=PRESETS[k].cols.slice();state.colMenu=false;render()});
 document.querySelectorAll('[data-cols]').forEach(x=>x.onclick=()=>{state.techCols=[];state.techPreset='custom';render()});
 document.querySelectorAll('[data-col]').forEach(x=>x.onchange=()=>{let k=x.dataset.col;
  state.techCols=x.checked?TECH_COLS.filter(c=>state.techCols.includes(c)||c===k):state.techCols.filter(c=>c!==k);
  let hit=Object.entries(PRESETS).find(([,p])=>p.cols.length===state.techCols.length&&p.cols.every(c=>state.techCols.includes(c)));
  state.techPreset=hit?hit[0]:'custom';render()});
 on('#colMenu','ontoggle',e=>{state.colMenu=e.target.open});
 document.querySelectorAll('[data-cmpmode]').forEach(x=>x.onclick=()=>{state.cmpMode=x.dataset.cmpmode;state.cmpColors={};cmpSelected().forEach(cmpColor);render()});
 document.querySelectorAll('[data-cmp]').forEach(x=>x.onclick=()=>{let id=x.dataset.cmp,list=state.cmpMode==='market'?state.cmpMarkets:state.cmpTechs,i=list.indexOf(id);
  if(i>=0){list.splice(i,1);delete state.cmpColors[id]}else{list.push(id);cmpColor(id)}render()});
 on('#cmpMetric','onchange',e=>{state.cmpMetric=e.target.value;render()});
 on('#trendMetric','onchange',e=>{state.trendMetric=e.target.value;render()});
 on('#quality','onclick',()=>document.querySelector('#qualityPanel').classList.toggle('hidden'));
 document.querySelectorAll('[data-goal]').forEach(x=>x.onchange=e=>{state.goals[e.target.dataset.goal]=n(e.target.value);state.cache.clear()});
 on('#exportGoals','onclick',async()=>{
  let btn=document.querySelector('#exportGoals'),json=JSON.stringify(state.goals,null,2),
  say=t=>{btn.textContent=t;setTimeout(()=>{btn.textContent='Export goals JSON'},2600)},dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(err){dl=null}
  if(dl){try{await dl.save({filename:'nubrakes-goals.json',data:json});say('Goals exported')}
   catch(err){say(err&&err.code==='declined'?'Export canceled':'Export unavailable here')}return}
  let a=document.createElement('a'),url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.href=url;a.download='nubrakes-goals.json';a.click();URL.revokeObjectURL(url);say('Goals exported')});
 on('#importGoals','onchange',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{state.goals=JSON.parse(r.result);state.cache.clear();render()}catch(err){alert('That file is not valid goals JSON. Export a goals file first, edit the values, then import it again.')}};r.readAsText(f)});
 on('#close','onclick',()=>{state.detail=null;render()})}
function render(){
 state.cache.clear();
 let body=state.tab==='market'?marketView():state.tab==='tech'?techView():state.tab==='compare'?compareView():state.tab==='trend'?trendView():state.tab==='goals'?goalsView():definitions();
 document.querySelector('#app').innerHTML='<div class="app-inner">'+controls()+'<div id="qualityPanel" class="hidden">'+quality()+'</div>'+body+'</div>'+(state.detail?detail(state.detail):'');
 wire();drawSparklines();drawTrend();drawCompare()}
async function load(){try{
 let opt={cache:'no-cache'},res=await Promise.all([fetch(OPS_URL,opt).then(r=>r.ok?r.json():Promise.reject(OPS_URL)),
  fetch(LABOR_URL,opt).then(r=>r.ok?r.json():fetch(LABOR_FALLBACK,opt).then(x=>x.ok?x.json():Promise.reject(LABOR_URL+' / fallback')))]);
 state.ops=res[0];state.labor=res[1];
 if(!state.ops.some(r=>r.pt_ft_tagging))state.employment='all';
 allocate();render()}
catch(e){document.querySelector('#app').innerHTML='<div class="notice"><h2>Unable to load dashboard data</h2><p>Failed feed: '+esc(String(e))+'. Check your connection and retry. Operations URL: '+OPS_URL+'; Labor URL: '+LABOR_URL+'</p><button class="btn" onclick="location.reload()">Retry</button></div>'}}
load();
</script>

</body></html>
