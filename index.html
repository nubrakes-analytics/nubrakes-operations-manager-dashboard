function median(a){let x=a.filter(v=>v!=null).sort((a,b)=>a-b);return x.length?x[Math.floor(x.length/2)]:null}function techView(){let rows=selectedRows(),by=new Map;rows.forEach(r=>{let a=by.get(r.technician_id)||[];a.push(r);by.set(r.technician_id,a)});let metrics=['revenue','jobs','avgTicket','serviceRate','clockedHours','invoicedHours','utilization','grossProfit','grossMargin'];let data=[...by].map(([id,rs])=>({id,name:rs[0].technician_name,market:rs[0].market_name,...summarize(rs)}));let cols=[['name','Technician'],['market','Market'],['daysWorked','Days Worked'],['revenue','Revenue'],['revenuePerDay','Revenue / Day'],['jobs','Jobs Completed'],['jobsPerDay','Jobs / Day'],...metrics.slice(2).map(k=>[k,METRICS[k].label])];let med={};metrics.forEach(k=>med[k]=median(data.filter(x=>x.market===state.market||state.market==='All Markets').map(x=>x[k])));let sk=state.sort.key;data.sort((a,b)=>typeof a[sk]==='string'?state.sort.dir*a[sk].localeCompare(b[sk]):state.sort.dir*((a[sk]??-Infinity)-(b[sk]??-Infinity)));return `<section class="section"><h2>Technician performance</h2><p class="small">Thin markers compare each technician with their market median. Click a name for trend and market rank.</p><div class="scroll"><table><thead><tr>${cols.map(([k,l])=>`<th data-sort="${k}">${l} ${state.sort.key===k?(state.sort.dir===1?'↑':'↓'):'↕'}</th>`).join('')}</tr></thead><tbody>${data.map(x=>`<tr>${cols.map(([k],i)=>{let v=x[k],f=METRICS[k]?.format||'number',mark=metrics.includes(k)&&med[k]!=null&&v!=null?`<div class="median"><i style="width:${Math.min(100,Math.max(2,50+(v-med[k])/(Math.abs(med[k])||1)*50))}%"></i></div>`:'';return `<td class="${i===0?'sticky-name link':''}" ${i===0?`data-tech="${x.id}"`:''}>${k==='name'||k==='market'?v:num(v,f)}${mark}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function trendView(){let rows=selectedRows(),available=Object.keys(METRICS).filter(k=>!['goal','variance','revenuePace','jobsPace'].includes(k));let groups=new Map;if(state.granularity==='weekly')rows.forEach(r=>{let k=week(r);(groups.get(k)||groups.set(k,[]).get(k)).push(r)});else rows.forEach(r=>{let k=day(r);(groups.get(k)||groups.set(k,[]).get(k)).push(r)});let data=[...groups].sort().map(([k,rs])=>({label:state.granularity==='weekly'?'Week of Thu '+fmtDate(k):fmtDate(k),value:summarize(rs)[state.trendMetric]}));return `<section class="section"><div class="subbar"><label class="field">KPI<select id="trendMetric">${available.map(k=>`<option value="${k}" ${k===state.trendMetric?'selected':''}>${METRICS[k].label}</option>`).join('')}</select></label><div>${[['daily','Daily'],['weekly','Weekly'],['mtdcurve','Month-to-Date']].map(([k,l])=>`<button class="${state.granularity===k?'active':''}" data-gran="${k}">${l}</button>`).join('')}</div></div><div class="chart-wrap"><canvas id="trendChart"></canvas></div><div id="trendFallback" class="hidden"></div></section>`}
function goalsView(){let months=[...new Set(state.ops.map(day).map(x=>x.slice(0,7)))].slice(-4),markets=[...new Set(state.ops.map(r=>r.market_name))].sort();return `<section class="section"><h2>Monthly revenue goals</h2><p class="small">Defaults are trailing three-month market average revenue. Values live only in this page until you export them.</p><div class="scroll"><table class="goal-table"><thead><tr><th>Market</th>${months.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${markets.map(m=>`<tr><td>${m}</td>${months.map(mon=>{let key=m+'|'+mon,v=state.goals[key]??goalDefault(m,mon);return `<td><input data-goal="${key}" type="number" value="${Math.round(v)}"></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p><button id="exportGoals">Export goals JSON</button> <label class="chip">Import goals JSON <input id="importGoals" type="file" accept="application/json" hidden></label></p></section>`}function goalDefault(m,mon){let past=[...new Set(state.ops.map(day).map(x=>x.slice(0,7)))].filter(x=>x<mon).slice(-3);let vals=past.map(x=>summarize(state.ops.filter(r=>r.market_name===m&&day(r).slice(0,7)===x),{noCache:true}).revenue);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0}
function definitions(){return `<section class="section"><h2>Metric definitions</h2><p class="small">All dashboard calculations originate in the shared registry shown here.</p><div class="scroll"><table class="definition"><thead><tr><th>Metric</th><th>Formula</th><th>Source fields</th><th>Definition</th></tr></thead><tbody>${Object.values(METRICS).map(m=>`<tr><td>${m.label}</td><td>${m.formula}</td><td>${m.fields}</td><td>${m.description||'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
function quality(){let noLabor=[...new Map(state.ops.filter(r=>!state.labor.some(l=>l.technician_id===r.technician_id)).map(r=>[r.technician_id,{name:r.technician_name,markets:new Set()}])).values()];state.ops.filter(r=>!state.labor.some(l=>l.technician_id===r.technician_id)).forEach(r=>noLabor.find(x=>x.name===r.technician_name)?.markets.add(r.market_name));let missing=state.ops.filter(r=>String(r.normalized_actual_duration_minutes).trim()==='').length,parts=state.ops.reduce((a,r)=>a+n(r.parts_lines_missing_cost),0),bad=[];let by=new Map;state.ops.forEach(r=>{let a=by.get(r.technician_id)||[];a.push(r);by.set(r.technician_id,a)});by.forEach(rs=>{let s=summarize(rs);if(s.utilization!=null&&(s.utilization>1||s.utilization<.2))bad.push(`${rs[0].technician_name}: ${num(s.utilization,'percent')}`)});return `<section class="section"><h2>Data quality & coverage</h2><p class="warn">Parts-cost gaps can overstate gross margin.</p><ul><li><b>Operations without labor:</b> ${noLabor.map(x=>`${x.name} (${[...x.markets].join(', ')})`).join('; ')||'None'}</li><li><b>Missing normalized wrench time:</b> ${missing} daily rows (treated as null).</li><li><b>Parts lines missing cost:</b> ${parts}.</li><li><b>Weeks allocated at week level due to zero worked days:</b> ${state.allocated.filter(x=>x.fallback).length} allocations.</li><li><b>Likely utilization exceptions:</b> ${bad.join('; ')||'None'}.</li></ul><p class="small">Labor is evenly allocated across worked days. If none exist in a labor week, it remains attributed to the technician's most frequent market rather than being dropped.</p></section>`}
function detail(id){let rs=selectedRows({tech:id}),s=summarize(rs),market=rs[0]?.market_name,all=[...new Map(selectedRows({market}).map(r=>[r.technician_id,selectedRows({tech:r.technician_id})])).values()].map(x=>summarize(x)),rank=k=>{let vals=all.map(x=>x[k]).filter(v=>v!=null).sort((a,b)=>b-a);return s[k]==null?'—':(vals.findIndex(v=>v===s[k])+1)+' / '+vals.length};return `<aside class="detail"><button class="close" id="close">Close</button><div class="group-name">${market}</div><h2>${rs[0]?.technician_name||'Technician'}</h2><p class="small">Daily metrics for the active period; rank is within market.</p><table>${['revenue','jobs','avgTicket','serviceRate','utilization','grossProfit','grossMargin'].map(k=>`<tr><td>${METRICS[k].label}</td><td>${num(s[k],METRICS[k].format)}</td><td class="small">Rank ${rank(k)}</td></tr>`).join('')}</table></aside>`}
function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelector('#period').onchange=e=>{state.period=e.target.value;state.periodKey='';state.cache.clear();render()};document.querySelector('#periodKey').onchange=e=>{state.periodKey=e.target.value;state.cache.clear();render()};document.querySelector('#market').onchange=e=>{state.market=e.target.value;state.cache.clear();render()};document.querySelector('#techs').onchange=e=>{state.techs=[...e.target.selectedOptions].map(o=>o.value);state.cache.clear();render()};document.querySelectorAll('[data-market]').forEach(x=>x.onclick=()=>{state.market=x.dataset.market;state.tab='tech';render()});document.querySelectorAll('[data-tech]').forEach(x=>x.onclick=()=>{state.detail=x.dataset.tech;render()});document.querySelectorAll('[data-sort]').forEach(x=>x.onclick=()=>{let k=x.dataset.sort;state.sort={key:k,dir:state.sort.key===k?-state.sort.dir:-1};render()});document.querySelectorAll('[data-gran]').forEach(x=>x.onclick=()=>{state.granularity=x.dataset.gran;render()});let tm=document.querySelector('#trendMetric');if(tm)tm.onchange=e=>{state.trendMetric=e.target.value;render()};document.querySelector('#quality').onclick=()=>{let q=document.querySelector('#qualityPanel');q.classList.toggle('hidden')};document.querySelectorAll('[data-goal]').forEach(x=>x.onchange=e=>{state.goals[e.target.dataset.goal]=n(e.target.value);state.cache.clear()});let ex=document.querySelector('#exportGoals');if(ex)ex.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.goals,null,2)],{type:'application/json'}));a.download='nubrakes-goals.json';a.click()};let im=document.querySelector('#importGoals');if(im)im.onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>{try{state.goals=JSON.parse(r.result);state.cache.clear();render()}catch{alert('Invalid goals JSON')}};r.readAsText(f)}};let close=document.querySelector('#close');if(close)close.onclick=()=>{state.detail=null;render()}}
function sparkSeries(key){let endKey=activePeriodKey(),keys=periodKeys().filter(k=>k<=endKey).slice(-8),base=state.ops.filter(r=>(state.market==='All Markets'||r.market_name===state.market)&&(!state.techs.length||state.techs.includes(r.technician_id))),bucket=r=>state.period==='day'?day(r):state.period==='week'?week(r):day(r).slice(0,7);return{keys,values:keys.map(k=>{let rs=base.filter(r=>bucket(r)===k),last=rs.map(day).sort().at(-1),opts=state.period==='month'&&last?{pace:last,noCache:true}:{noCache:true};return summarize(rs,opts)[key]})}}
function drawSparklines(){if(state.tab!=='market')return;document.querySelectorAll('.sparkline').forEach(canvas=>{let key=canvas.dataset.spark,{keys,values}=sparkSeries(key),finite=values.filter(Number.isFinite),ratio=window.devicePixelRatio||1,w=Math.max(100,canvas.clientWidth),h=32;canvas.width=w*ratio;canvas.height=h*ratio;let ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#eef2f7';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,h-4);ctx.lineTo(w,h-4);ctx.stroke();if(!finite.length){ctx.fillStyle='#9ca3af';ctx.font='10px system-ui';ctx.fillText('No trend data',2,19);return}let min=Math.min(...finite),max=Math.max(...finite),spread=max-min||Math.abs(max)||1,x=i=>keys.length===1?w/2:i*(w-4)/(keys.length-1)+2,y=v=>h-5-(v-min)/spread*(h-10),color=key==='variance'?(finite.at(-1)>=0?'#10b981':'#f43f5e'):'#6366f1';ctx.strokeStyle=color;ctx.lineWidth=1.75;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();let drawing=false;values.forEach((v,i)=>{if(!Number.isFinite(v)){drawing=false;return}if(!drawing){ctx.moveTo(x(i),y(v));drawing=true}else ctx.lineTo(x(i),y(v))});ctx.stroke();let lastIndex=values.findLastIndex(Number.isFinite);if(lastIndex>=0){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x(lastIndex),y(values[lastIndex]),2.4,0,Math.PI*2);ctx.fill()}canvas.title=`${METRICS[key].label}: ${keys[0]} to ${keys.at(-1)}`})}
function drawTrend(){if(state.tab!=='trend')return;let rows=selectedRows(),groups=new Map,weekly=state.granularity==='weekly';rows.forEach(r=>{let k=weekly?week(r):day(r);(groups.get(k)||groups.set(k,[]).get(k)).push(r)});let labels=[...groups.keys()].sort(),vals=labels.map(k=>summarize(groups.get(k))[state.trendMetric]);if(!window.Chart){document.querySelector('#trendFallback').classList.remove('hidden');document.querySelector('#trendFallback').innerHTML=`<div class="scroll"><table class="fallback"><tr><th>Period</th><th>${METRICS[state.trendMetric].label}</th></tr>${labels.map((x,i)=>`<tr><td>${weekly?'Week of Thu ':''}${fmtDate(x)}</td><td>${num(vals[i],METRICS[state.trendMetric].format)}</td></tr>`).join('')}</table></div>`;return}trendChart?.destroy();trendChart=new Chart(document.querySelector('#trendChart'),{type:weekly?'bar':'line',data:{labels:labels.map(x=>weekly?'Thu '+fmtDate(x):fmtDate(x)),datasets:[{label:METRICS[state.trendMetric].label,data:vals,borderColor:'#6366f1',backgroundColor:'#6366f155',fill:false,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>num(v,METRICS[state.trendMetric].format)}}}}})}
function render(){state.cache.clear();let body=state.tab==='market'?marketView():state.tab==='tech'?techView():state.tab==='trend'?trendView():state.tab==='goals'?goalsView():definitions();document.querySelector('#app').innerHTML=`<div class="app-inner">${controls()}<div id="qualityPanel" class="hidden">${quality()}</div>${body}</div>`+(state.detail?detail(state.detail):'');wire();drawSparklines();drawTrend()}
async function load(){try{let [ops,lab]=await Promise.all([fetch(OPS_URL).then(r=>r.ok?r.json():Promise.reject(OPS_URL)),fetch(LABOR_URL).then(r=>r.ok?r.json():fetch(LABOR_FALLBACK).then(x=>x.ok?x.json():Promise.reject(LABOR_URL+' / fallback')))]);state.ops=ops;state.labor=lab;allocate();render()}catch(e){document.querySelector('#app').innerHTML=`<div class="notice"><h2>Unable to load dashboard data</h2><p>Failed feed: ${String(e)}. Check your connection and retry. Operations URL: ${OPS_URL}; Labor URL: ${LABOR_URL}</p><button onclick="location.reload()">Retry</button></div>`}}load();
</script></body></html>
